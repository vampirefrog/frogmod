services:
  game-server:
    image: vampirefrog/frogmod:latest
    ports:
      - "28785-28787:28785-28787"  # Sauerbraten server ports (UDP and TCP)
    volumes:
      - ./server-init.cfg:/app/server-init.cfg  # Mount config file (server-specific)
      - ./data:/app/data  # Mount data directory for maps/logs if needed
    restart: unless-stopped
